name: Build production image archive

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the release image on the runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: agql-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/UnlikeOtherAI/AgQL
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Package the image archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agql-release"
          cd "$RUNNER_TEMP/agql-release"
          docker image inspect --format '{{.Id}}' "agql-api:$GITHUB_SHA" > image-id.txt
          printf '%s\n' "$GITHUB_SHA" > revision.txt
          docker save "agql-api:$GITHUB_SHA" | gzip -1 > agql-images.tar.gz
          sha256sum agql-images.tar.gz image-id.txt revision.txt > SHA256SUMS
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: agql-image-${{ github.sha }}
          path: ${{ runner.temp }}/agql-release/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
